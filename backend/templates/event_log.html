<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Per-computer event summary with CSV export">
    <title>Lab PC Monitor — Event Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- ============================================================
             HEADER
             ============================================================ -->
        <header class="header" id="header">
            <div class="header-left">
                <div class="logo">PC</div>
                <h1>Lab PC Monitor</h1>
            </div>
            <div class="header-right">
                <a class="btn" href="/">📊 Dashboard</a>
                <a class="btn btn-active" href="/event-log">📋 Event Log</a>
                <a class="btn" href="/logs">📄 All Logs</a>
                <div class="pulse-dot" id="live-indicator"></div>
                <span style="font-size:12px; color:var(--text-muted)" id="last-refresh">—</span>
                <button class="btn" id="btn-refresh" onclick="refreshAll()">
                    ↻ Refresh
                </button>
                <button class="btn" id="btn-export" onclick="exportCSV()">
                    ↓ Export CSV
                </button>
            </div>
        </header>

        <!-- ============================================================
             FILTERS
             ============================================================ -->
        <div class="section-title">
            <span>📋</span> Event Log — PC Summary
        </div>
        <div class="filters" id="filters-bar">
            <div class="search-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input class="search-input" type="text" id="search-hostname"
                       placeholder="Search hostname..." oninput="onFilterChange()">
            </div>
            <select class="filter-select" id="filter-room" onchange="onFilterChange()">
                <option value="">All Rooms</option>
            </select>
        </div>

        <!-- ============================================================
             TABLE
             ============================================================ -->
        <div class="table-wrapper" id="pc-summary-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Hostname</th>
                            <th>Last Boot</th>
                            <th>Last Shutdown</th>
                            <th>Last Restart</th>
                            <th>Last Crash</th>
                        </tr>
                    </thead>
                    <tbody id="pc-summary-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        /* ==============================================================
           STATE
           ============================================================== */
        const API_BASE = window.location.origin + '/api';
        const ROOMS = ['601','602','603','604','605','606','608','610','611',
                       '621','622','623','624','625','626','627','628','629','630'];

        let allLogs = [];
        let summaryRows = [];
        let autoRefreshInterval = null;

        /* ==============================================================
           API CALLS
           ============================================================== */
        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function fetchLogs() {
            const data = await fetchJSON(`${API_BASE}/logs?limit=5000`);
            allLogs = data.data || [];
            renderPcSummary();
        }

        async function refreshAll() {
            try {
                await fetchLogs();
                document.getElementById('last-refresh').textContent =
                    'Updated ' + new Date().toLocaleTimeString();
            } catch (e) {
                showToast('Failed to fetch data: ' + e.message, 'error');
            }
        }

        /* ==============================================================
           PC SUMMARY
           ============================================================== */
        function onFilterChange() {
            renderPcSummary();
        }

        function renderPcSummary() {
            const room = document.getElementById('filter-room').value;
            const search = document.getElementById('search-hostname').value.toLowerCase();
            const tbody = document.getElementById('pc-summary-tbody');

            const byHost = new Map();
            allLogs.forEach(l => {
                const h = l.hostname.toLowerCase();
                if (room && !h.includes(room)) return;
                if (search && !h.includes(search)) return;
                if (l.event_type !== 'Boot' && l.event_type !== 'Shutdown' && l.event_type !== 'Restart' && l.event_type !== 'Crash') return;

                if (!byHost.has(l.hostname)) {
                    byHost.set(l.hostname, { Boot: null, Shutdown: null, Restart: null, Crash: null });
                }
                const row = byHost.get(l.hostname);
                if (!row[l.event_type] || l.created_at > row[l.event_type]) {
                    row[l.event_type] = l.created_at;
                }
            });

            const rows = Array.from(byHost.entries())
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([hostname, times]) => ({ hostname: hostname, ...times }));
            summaryRows = rows;

            if (!rows.length) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state"><p>No computers found</p></div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = rows.map(r => `
                <tr>
                    <td class="hostname-cell">${esc(r.hostname)}</td>
                    <td class="time-cell">${formatTime(r.Boot)}</td>
                    <td class="time-cell">${formatTime(r.Shutdown)}</td>
                    <td class="time-cell">${formatTime(r.Restart)}</td>
                    <td class="time-cell">${formatTime(r.Crash)}</td>
                </tr>
            `).join('');
        }

        /* ==============================================================
           EXPORT CSV
           ============================================================== */
        function exportCSV() {
            if (!summaryRows.length) {
                showToast('No data to export', 'error');
                return;
            }

            const headers = ['hostname', 'last boot', 'last shutdown', 'last restart', 'last crash'];
            const rows = summaryRows.map(r => [
                r.hostname,
                r.Boot || '',
                r.Shutdown || '',
                r.Restart || '',
                r.Crash || '',
            ]);

            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pc_summary_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            showToast(`Exported ${summaryRows.length} records`, 'success');
        }

        /* ==============================================================
           TOAST NOTIFICATIONS
           ============================================================== */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = `fadeOut 300ms ease-in forwards`;
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* ==============================================================
           UTILITIES
           ============================================================== */
        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
                   ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function populateRooms() {
            const select = document.getElementById('filter-room');
            ROOMS.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = 'Room ' + r;
                select.appendChild(opt);
            });
        }

        /* ==============================================================
           INIT
           ============================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            populateRooms();
            refreshAll();
            // Auto-refresh every 30 seconds
            autoRefreshInterval = setInterval(refreshAll, 30000);
        });
    </script>
</body>
</html>
