<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lab PC Monitoring Dashboard — Real-time monitoring of lab computer events">
    <title>PC Logger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- ============================================================
             HEADER
             ============================================================ -->
        <header class="header" id="header">
            <div class="header-left">
                <div class="logo">PC</div>
                <h1>Lab PC Monitor</h1>
            </div>
            <div class="header-right">
                <a class="btn btn-active" href="/">📊 Dashboard</a>
                <a class="btn" href="/event-log">📋 Event Log</a>
                <a class="btn" href="/logs">📄 All Logs</a>
                <div class="pulse-dot" id="live-indicator"></div>
                <span style="font-size:12px; color:var(--text-muted)" id="last-refresh">—</span>
                <button class="btn" id="btn-refresh" onclick="refreshAll()">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <!-- ============================================================
             STATS
             ============================================================ -->
        <section class="stats-grid" id="stats-grid">
            <div class="stat-card blue">
                <div class="stat-label">Total Events</div>
                <div class="stat-value" id="stat-total">—</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">Boots</div>
                <div class="stat-value" id="stat-boot">—</div>
            </div>
            <div class="stat-card amber">
                <div class="stat-label">Shutdowns</div>
                <div class="stat-value" id="stat-shutdown">—</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">Restarts</div>
                <div class="stat-value" id="stat-restart">—</div>
            </div>
            <div class="stat-card red">
                <div class="stat-label">Crashes</div>
                <div class="stat-value" id="stat-crash">—</div>
            </div>
        </section>

        <!-- ============================================================
             COMPUTER STATUS
             ============================================================ -->
        <div class="section-title">
            <span>💻</span> Computer Status
        </div>
        <section class="status-grid" id="status-grid">
            <!-- Populated by JS -->
        </section>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        /* ==============================================================
           STATE
           ============================================================== */
        const API_BASE = window.location.origin + '/api';

        let allLogs = [];
        let autoRefreshInterval = null;

        /* ==============================================================
            API CALLS
            ============================================================== */
        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function fetchLogs() {
            const data = await fetchJSON(`${API_BASE}/logs?limit=5000`);
            allLogs = data.data || [];
            updateStats();
        }

        async function fetchStatus() {
            const data = await fetchJSON(`${API_BASE}/status`);
            renderStatusGrid(data.data || []);
        }

        async function refreshAll() {
            try {
                await Promise.all([fetchLogs(), fetchStatus()]);
                document.getElementById('last-refresh').textContent =
                    'Updated ' + new Date().toLocaleTimeString();
            } catch (e) {
                showToast('Failed to fetch data: ' + e.message, 'error');
            }
        }

        /* ==============================================================
            STATS
            ============================================================== */
        function updateStats() {
            const counts = { Boot: 0, Shutdown: 0, Restart: 0, Crash: 0 };
            allLogs.forEach(l => { if (counts[l.event_type] !== undefined) counts[l.event_type]++; });

            document.getElementById('stat-total').textContent = allLogs.length;
            document.getElementById('stat-boot').textContent = counts.Boot;
            document.getElementById('stat-shutdown').textContent = counts.Shutdown;
            document.getElementById('stat-restart').textContent = counts.Restart;
            document.getElementById('stat-crash').textContent = counts.Crash;

            // Animate numbers
            document.querySelectorAll('.stat-value').forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; // reflow
                el.style.animation = 'fadeInUp 0.3s ease-out';
            });
        }

        /* ==============================================================
            STATUS GRID
            ============================================================== */
        function renderStatusGrid(statuses) {
            const grid = document.getElementById('status-grid');
            if (!statuses.length) {
                grid.innerHTML = '<div class="empty-state"><p>No computers registered yet.</p></div>';
                return;
            }

            grid.innerHTML = statuses.map(s => {
                const isOnline = s.last_event === 'Boot';
                const cls = isOnline ? 'online' : 'offline';
                const ago = timeAgo(s.last_event_at);
                return `
                    <div class="status-card">
                        <div class="status-indicator ${cls}"></div>
                        <div class="status-info">
                            <div class="status-hostname">${esc(s.hostname)}</div>
                            <div class="status-detail">${esc(s.last_event)} · ${ago}</div>
                        </div>
                        <span class="badge badge-${s.last_event}">
                            <span class="badge-dot"></span>
                            ${esc(s.last_event)}
                        </span>
                    </div>
                `;
            }).join('');
        }

        /* ==============================================================
            TOAST NOTIFICATIONS
            ============================================================== */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = `fadeOut 300ms ease-in forwards`;
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* ==============================================================
            UTILITIES
            ============================================================== */
        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
                   ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const diff = (Date.now() - new Date(iso).getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        /* ==============================================================
            INIT
            ============================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
            // Auto-refresh every 30 seconds
            autoRefreshInterval = setInterval(refreshAll, 30000);
        });
    </script>
</body>
</html>
